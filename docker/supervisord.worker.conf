[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:laravel-init]
command=sh -c 'mkdir -p storage/logs storage/framework/cache storage/framework/views storage/framework/sessions && chmod -R 777 storage bootstrap/cache && php artisan config:cache'
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-queue]
command=php artisan queue:work database --sleep=2 --tries=3 --max-time=3600
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0